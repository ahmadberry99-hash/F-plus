<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-plus</title>
<style>
  body { font-family: Tahoma, sans-serif; margin: 0; background: #f1f5f9; display: flex; height: 100vh; }
  #auth { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; }
  .box { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; }
  input, select, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 6px; }
  .sec { background: #64748b; }
  #app { display: none; width: 100%; }
  .side { width: 220px; background: #0f172a; color: #fff; padding: 15px; display: flex; flex-direction: column; }
  .item { padding: 10px; margin: 4px 0; border-radius: 5px; cursor: pointer; }
  .item:hover { background: #2563eb; }
  .main { flex: 1; padding: 20px; overflow-y: auto; }
  .card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border-bottom: 1px solid #eee; padding: 8px; text-align: right; }
</style>
</head>
<body>

<div id="auth">
  <div class="box" id="f-in">
    <h2>تطبيق F-plus</h2>
    <input id="u" placeholder="اسم المستخدم">
    <input id="p" type="password" placeholder="كلمة المرور">
    <button type="button" onclick="window.doLogin()">دخول</button>
    <button type="button" class="sec" onclick="document.getElementById('f-in').style.display='none';document.getElementById('f-up').style.display='block';">طلب إنشاء حساب جديد</button>
    <p id="m1" style="color:red;"></p>
  </div>
  <div class="box" id="f-up" style="display:none;">
    <h2>حساب جديد</h2>
    <input id="rn" placeholder="الاسم الكامل">
    <input id="ru" placeholder="اسم مستخدم إنجليزي">
    <input id="rp" type="password" placeholder="كلمة مرور (6 خانات فأكثر)">
    <button type="button" onclick="window.doReg()">إرسال طلب الانضمام</button>
    <button type="button" class="sec" onclick="document.getElementById('f-up').style.display='none';document.getElementById('f-in').style.display='block';">رجوع</button>
    <p id="m2" style="color:red;"></p>
  </div>
</div>

<div id="wait" style="display:none; width:100%; align-items:center; justify-content:center;">
  <div class="box"><h2>حسابك قيد المراجعة</h2><button onclick="location.reload()">تحديث</button></div>
</div>

<div id="app">
  <div class="side"><h2>F-plus</h2><div id="menu"></div><button class="sec" onclick="window.doOut()" style="margin-top:auto;">خروج</button></div>
  <div class="main" id="view"></div>
</div>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://gstatic.com";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, updateDoc, addDoc } from "https://gstatic.com";

  const app = initializeApp({
    apiKey: "AIzaSyDtVi8oqsw7mXKQebxxuGEhUUGdqyZVqCM",
    authDomain: "://firebaseapp.com",
    projectId: "f-plus-94505",
    storageBucket: "f-plus-94505.firebasestorage.app",
    messagingSenderId: "601890979674",
    appId: "1:601890979674:web:4d68660983295597817d63"
  });
  const auth = getAuth(app);
  const db = getFirestore(app);
  let me = null, secs = [];

  window.doOut = () => signOut(auth);

  window.doLogin = async () => {
    document.getElementById('m1').innerText = 'جاري الدخول...';
    try {
      await signInWithEmailAndPassword(auth, document.getElementById('u').value.trim().toLowerCase() + '@fplus.local', document.getElementById('p').value);
    } catch(e) {
      document.getElementById('m1').innerText = 'خطأ في البيانات';
    }
  };

  window.doReg = async () => {
    const n = document.getElementById('rn').value.trim();
    const u = document.getElementById('ru').value.trim().toLowerCase();
    const p = document.getElementById('rp').value;
    if(!n || !u || p.length < 6) {
      document.getElementById('m2').innerText = 'أكمل الحقول وكلمة المرور 6 خانات';
      return;
    }
    document.getElementById('m2').innerText = 'جاري التسجيل...';
    try {
      const c = await createUserWithEmailAndPassword(auth, u + '@fplus.local', p);
      const s = await getDocs(collection(db, 'users'));
      const adm = s.empty;
      await setDoc(doc(db, 'users', c.user.uid), {
        fullName: n, username: u, role: adm ? 'admin' : 'user', status: adm ? 'active' : 'pending', allowedSections: []
      });
      if(adm) {
        const d = [
          {id:'home',title:'الرئيسية',options:['تعميم','ملاحظة']},
          {id:'alerts',title:'التنبيهات',options:['عاجل','تذكير']},
          {id:'reports',title:'التقارير',options:['يومي','أسبوعي']},
          {id:'acc',title:'المحاسبة',options:['قبض','صرف']},
          {id:'cli',title:'العملاء',options:['جديد','متابعة']}
        ];
        for(const x of d) await setDoc(doc(db, 'sections', x.id), x);
      }
      location.reload();
    } catch(e) {
      document.getElementById('m2').innerText = 'خطأ: ' + e.message;
    }
  };

  onAuthStateChanged(auth, async (u) => {
    if(!u) { document.getElementById('auth').style.display='flex'; document.getElementById('app').style.display='none'; return; }
    const d = await getDoc(doc(db, 'users', u.uid));
    if(!d.exists()) return;
    me = { uid: u.uid, ...d.data() };
    document.getElementById('auth').style.display='none';
    if(me.status === 'pending') { document.getElementById('wait').style.display='flex'; return; }
    document.getElementById('app').style.display='flex';
    
    const snap = await getDocs(collection(db, 'sections'));
    secs = []; snap.forEach(x => secs.push(x.data()));
    const m = document.getElementById('menu'); m.innerHTML = '';
    secs.forEach(s => {
      if(me.role === 'admin' || me.allowedSections.includes(s.id)) {
        const b = document.createElement('div'); b.className='item'; b.innerText=s.title; b.onclick=()=>showSec(s); m.appendChild(b);
      }
    });
    if(me.role === 'admin') {
      const a = document.createElement('div'); a.className='item'; a.style.color='#fbbf24'; a.innerText='إدارة النظام'; a.onclick=showAdm; m.appendChild(a);
    }
    if(m.firstChild) m.firstChild.click();
  });

  function showSec(s) {
    const v = document.getElementById('view');
    v.innerHTML = '<div class="card"><h3>'+s.title+'</h3><select id="t">'+s.options.map(o=>'<option>'+o+'</option>').join('')+'</select><input id="ti" placeholder="العنوان"><textarea id="de" placeholder="التفاصيل"></textarea><button id="sv">حفظ</button></div><div class="card" id="ls"></div>';
    document.getElementById('sv').onclick = async () => {
      await addDoc(collection(db, 'records'), { sec: s.id, type: document.getElementById('t').value, title: document.getElementById('ti').value, details: document.getElementById('de').value, by: me.fullName });
      showSec(s);
    };
    getDocs(collection(db, 'records')).then(r => {
      let h = '<table><tr><th>النوع</th><th>البيان</th><th>بواسطة</th></tr>';
      r.forEach(x => { const d = x.data(); if(d.sec===s.id && (me.role==='admin' || d.by===me.fullName)) h += '<tr><td>'+d.type+'</td><td>'+d.title+'<br><small>'+d.details+'</small></td><td>'+d.by+'</td></tr>'; });
      document.getElementById('ls').innerHTML = h + '</table>';
    });
  }

  function showAdm() {
    const v = document.getElementById('view');
    getDocs(collection(db, 'users')).then(u => {
      let h = '<table><tr><th>الاسم</th><th>الحالة</th><th>الصلاحيات</th><th>تفعيل</th></tr>';
      u.forEach(x => {
        const d = x.data(); if(d.role==='admin') return;
        const ch = secs.map(s => '<label><input type="checkbox" style="width:auto" '+(d.allowedSections?.includes(s.id)?'checked':'')+' onchange="window.tg(\''+x.id+'\',\''+s.id+'\',this.checked)">'+s.title+'</label> ').join('');
        h += '<tr><td>'+d.fullName+'</td><td>'+d.status+'</td><td>'+ch+'</td><td>'+(d.status==='pending'?'<button onclick="window.ap(\''+x.id+'\')">تفعيل</button>':'')+'</td></tr>';
      });
      v.innerHTML = '<div class="card"><h3>الأعضاء</h3>'+h+'</table></div><div class="card"><h3>إضافة قسم</h3><input id="ns" placeholder="اسم القسم"><input id="no" placeholder="الخيارات مفصولة بفاصلة"><button id="as">إضافة</button></div>';
      document.getElementById('as').onclick = async () => {
        const id = 's_' + Date.now();
        await setDoc(doc(db, 'sections', id), { id, title: document.getElementById('ns').value, options: document.getElementById('no').value.split(',') });
        location.reload();
      };
    });
  }

  window.ap = async (id) => { await updateDoc(doc(db, 'users', id), { status: 'active' }); showAdm(); };
  window.tg = async (uid, sid, ok) => {
    const r = doc(db, 'users', uid); const s = await getDoc(r); let a = s.data().allowedSections || [];
    if(ok) a.push(sid); else a = a.filter(x => x !== sid);
    await updateDoc(r, { allowedSections: a });
  };
</script>
</body>
</html>
